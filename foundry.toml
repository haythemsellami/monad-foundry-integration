[profile.default]
src = "src"
out = "out"
libs = ["lib"]
hardfork = "monad:MonadNine"
isolate = false
memory_limit = 8388608

# Pin solc version and disable optimizer for reproducible gas measurements
# across MonadGasTest (exact overhead constants) and MIP-3 tests (linear deltas).
solc_version = "0.8.28"
optimizer = false
via_ir = false

# MIP-3 testing profiles
[profile.monad_eight]
hardfork = "monad:MonadEight"
memory_limit = 134217728

[profile.monad_nine]
hardfork = "monad:MonadNine"
memory_limit = 8388608

[profile.network_monad]
network = "monad"
hardfork = "monad:MonadNine"

# Legacy v1.6-style alias. Kept here so the integration suite verifies the
# deprecated alias continues to resolve to canonical Monad network config.
[profile.legacy_monad_alias]
monad = true
hardfork = "monad:MonadNine"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
