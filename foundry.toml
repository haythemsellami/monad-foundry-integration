[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pin solc version for reproducible gas measurements
# Gas overhead values in tests (19, 25) are calibrated for this exact config
solc_version = "0.8.28"

# Optimizer OFF - matches how overhead values were measured
# WARNING: Changing these will invalidate the gas overhead constants in tests
optimizer = false

# Use legacy codegen (not IR) for predictable bytecode
via_ir = false

# MIP-3 testing profiles
[profile.monad_eight]
monad_hardfork = "MonadEight"

[profile.monad_nine]
monad_hardfork = "MonadNine"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
